# Render Blueprint — deploy via https://render.com/deploy
# Links this repo to a web service + managed Postgres
# Redis: use Upstash (free) — set REDIS_URL manually in the Render dashboard
#   1. Sign up at https://upstash.com
#   2. Create a Redis database (pick region closest to your Render service)
#   3. Copy the Redis URL (rediss://default:xxxxx@xxx.upstash.io:6379)
#   4. Paste as REDIS_URL in Render dashboard → Environment

services:
  # ── Web Service (Docker) ────────────────────────────────────
  - type: web
    name: statement-intelligence-engine
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter  # Change to "standard" for production
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4000"
      - key: DATABASE_URL
        fromDatabase:
          name: sie-postgres
          property: connectionString
      - key: REDIS_URL
        sync: false  # Set manually — use Upstash (see instructions above)
      - key: CLAUDE_API_KEY
        sync: false  # Set manually in Render dashboard
      - key: CLAUDE_MODEL
        value: claude-sonnet-4-6
      - key: CLAUDE_PROMPT_VERSION
        value: PROMPT_VERSION_1
      - key: API_KEYS
        sync: false  # Set manually in Render dashboard
      - key: CORS_ORIGINS
        sync: false  # Set to your frontend URL in Render dashboard
      - key: UPLOADS_DIR
        value: /app/data/uploads
    disk:
      name: uploads
      mountPath: /app/data/uploads
      sizeGB: 1

databases:
  # ── Managed PostgreSQL ──────────────────────────────────────
  - name: sie-postgres
    plan: starter  # Change to "standard" for production
    databaseName: statement_intel
    user: sie_user
